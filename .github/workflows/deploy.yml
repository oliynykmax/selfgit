name: Deploy

# Deploys the default branch to Cloudflare Workers: the selfgit backend, then the
# selfgit-astro front end. Configure it in the repository's "production" environment
# (Settings > Environments):
#   secret   CLOUDFLARE_API_TOKEN   token with Workers Scripts Edit and Workers R2 Storage Edit
#   variable CLOUDFLARE_ACCOUNT_ID  target account
#   variable DEPLOY_ENABLED         "true" to turn deploys on
#   variable GITHUB_OWNER_ID        numeric GitHub id of the only account allowed to push
#   variable DEPLOY_DOMAIN          optional custom domain for the front end; without it, workers.dev
# Add a required reviewer to the environment to approve each deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Deploy the backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_OWNER_ID: ${{ vars.GITHUB_OWNER_ID }}
        run: bunx wrangler deploy --var "GITHUB_OWNER_ID:$GITHUB_OWNER_ID"
      - run: bun --bun run astro:build
      - name: Deploy the front end
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
        run: |
          args=()
          if [ -n "$DEPLOY_DOMAIN" ]; then args+=(--domain "$DEPLOY_DOMAIN"); fi
          bunx wrangler deploy --config astro/dist/server/wrangler.json "${args[@]}"
